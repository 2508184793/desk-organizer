<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>输入</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
    .box {
      position: absolute; inset: 0;
      background: rgba(26, 28, 38, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      padding: 12px 14px 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    #ptitle { font-size: 13px; font-weight: 600; color: #e8eaf2; }
    #pinput {
      width: 100%; padding: 7px 9px;
      border-radius: 7px; border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.07); color: #fff; font-size: 13px; outline: none;
    }
    #pinput:focus { border-color: var(--accent, #4c8bf5); }
    .btns { display: flex; justify-content: flex-end; gap: 8px; }
    .btns button {
      padding: 5px 14px; border-radius: 7px; cursor: pointer;
      font-size: 12.5px; border: 1px solid rgba(255,255,255,0.2);
      background: transparent; color: #ccc;
    }
    .btns button:hover { background: rgba(255,255,255,0.1); }
    #p-ok { background: #4c8bf5 !important; border: none !important; color: #fff !important; }
    #p-ok:hover { background: #5c9bf5 !important; }
  </style>
</head>
<body>
  <div class="box">
    <div id="ptitle">输入</div>
    <input id="pinput" spellcheck="false" />
    <div class="btns">
      <button id="p-cancel">取消</button>
      <button id="p-ok">确定</button>
    </div>
  </div>
  <script src="prompt.js"></script>
</body>
</html>
