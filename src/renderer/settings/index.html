<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>桌面整理助手 - 设置</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div id="app">
    <aside>
      <div class="logo">
        <span class="logo-icon">🧩</span>
        <div>
          <div class="logo-title">桌面整理助手</div>
          <div class="logo-sub">Desk Organizer</div>
        </div>
      </div>
      <nav>
        <button class="nav-btn active" data-tab="partitions">🗂 分区管理</button>
        <button class="nav-btn" data-tab="rules">⚙️ 自动规则</button>
        <button class="nav-btn" data-tab="history">📊 分组总览</button>
        <button class="nav-btn" data-tab="prefs">🖥 其他设置</button>
      </nav>
      <div class="aside-actions">
        <button id="btn-organize" class="primary">✨ 一键整理</button>
      </div>
      <div id="organize-status" class="status" hidden></div>
    </aside>

    <main>
      <!-- 分区管理 -->
      <section id="tab-partitions" class="tab active">
        <div class="tab-head">
          <h2>分区管理</h2>
          <p class="hint">分区是桌面上悬浮的收纳盒子，绑定真实文件夹。拖动面板可移动、角落手柄可缩放。</p>
        </div>
        <div id="partitions-grid" class="grid"></div>
      </section>

      <!-- 自动规则 -->
      <section id="tab-rules" class="tab">
        <div class="tab-head">
          <h2>自动归类规则</h2>
          <p class="hint">新文件出现在桌面后，会按这里的规则自动归入对应分区。优先级越小越先匹配。</p>
        </div>
        <div id="rules-list"></div>
        <button id="btn-add-rule" class="ghost">＋ 添加规则</button>
      </section>

      <!-- 分组总览 -->
      <section id="tab-history" class="tab">
        <div class="tab-head">
          <h2>分组总览</h2>
          <p class="hint">当前桌面文件的分组情况。虚拟分区模式：文件原地不动，只是按规则/分配归组显示。</p>
        </div>
        <div id="history-list"></div>
      </section>

      <!-- 其他设置 -->
      <section id="tab-prefs" class="tab">
        <div class="tab-head"><h2>其他设置</h2></div>
        <div class="prefs">
          <label class="switch-row">
            <span><b>启动时自动隐藏系统图标</b><small>启动即接管桌面隐藏系统图标，退出程序时自动恢复显示；手动切换过则保持现状</small></span>
            <input type="checkbox" id="pref-autohide" class="switch" />
          </label>
          <label class="switch-row">
            <span><b>隐藏系统桌面图标</b><small>立即隐藏/显示系统图标（手动模式，切换后退出不再自动恢复）</small></span>
            <input type="checkbox" id="pref-icons" class="switch" />
          </label>
          <label class="switch-row">
            <span><b>开机自动启动</b><small>登录 Windows 后自动运行本工具</small></span>
            <input type="checkbox" id="pref-autostart" class="switch" />
          </label>
          <div class="about">
            <b>桌面整理助手 v1.1.1</b>
            <small>分区收纳 + 规则自动归类 · 虚拟分区零移动</small>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="settings.js"></script>
</body>
</html>
